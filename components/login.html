<div id="login-screen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center space-y-6">
        <div class="space-y-2">
            <h1 class="text-2xl font-black text-slate-950 tracking-wide">BIRO JASA SPS</h1>
            <p class="text-xs text-gray-400">Verifikasi Keamanan Akses Owner</p>
        </div>
        
        <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100 text-left space-y-1">
            <span class="text-[10px] uppercase font-bold text-gray-400 tracking-wider">Nomor Tujuan OTP</span>
            <p class="text-sm font-bold text-slate-800">+62 895-4284-00665</p>
            <p class="text-[10px] text-gray-400">Pesan OTP akan dikirim murni lewat server WhatsApp botmrd Anda.</p>
        </div>

        <div id="area-request-otp">
            <!-- DITAMBAHKAN type="button" -->
            <button type="button" id="btn-request-otp" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-semibold py-3 rounded-2xl transition shadow-md">
                Minta Kode OTP
            </button>
        </div>

        <div id="area-verify-otp" class="space-y-4 hidden">
            <div class="space-y-1">
                <label class="block text-xs font-semibold text-gray-500 text-left">Masukkan 6 Digit Kode OTP *</label>
                <input type="text" id="input-otp" placeholder="******" maxlength="6" class="w-full text-center tracking-widest text-xl font-bold px-4 py-3 border rounded-2xl focus:ring-2 focus:ring-orange-500">
            </div>
            <!-- DITAMBAHKAN type="button" -->
            <button type="button" id="btn-verify-otp" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-semibold py-3 rounded-2xl transition">
                Verifikasi Kode
            </button>
            <p id="otp-timer" class="text-xs text-rose-500 italic font-medium"></p>
        </div>
    </div>
</div>
