<div id="login-screen" class="fixed inset-0 bg-slate-950 z-50 flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center space-y-6">
        <div class="space-y-2">
            <h1 class="text-2xl font-black text-slate-950 tracking-wide">BIRO JASA SPS</h1>
            <p class="text-xs text-gray-400">Masuk ke Sistem Internal Owner</p>
        </div>

        <form id="form-login" onsubmit="return false;" class="space-y-4 text-left">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Username *</label>
                <input type="text" id="login-username" placeholder="Masukkan username" autocomplete="off" class="w-full px-4 py-3 border rounded-2xl text-sm focus:ring-2 focus:ring-orange-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Password *</label>
                <input type="password" id="login-password" placeholder="••••••••" autocomplete="off" class="w-full px-4 py-3 border rounded-2xl text-sm focus:ring-2 focus:ring-orange-500 focus:outline-none">
            </div>

            <button type="button" id="btn-login" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-semibold py-3 rounded-2xl transition shadow-md mt-2">
                Masuk Sekarang
            </button>
        </form>
    </div>
</div>
