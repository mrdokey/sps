<div id="modal-klien" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
        <div class="flex justify-between items-center mb-4 border-b pb-3">
            <h3 class="text-lg font-bold text-gray-800">Tambah Data Klien</h3>
            <button id="btn-close-modal-klien" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        
        <form id="form-klien" class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Nama Lengkap *</label>
                <input type="text" id="klien-nama" class="w-full px-3 py-2 border rounded-xl text-sm" required>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Nomor WhatsApp *</label>
                <input type="tel" id="klien-wa" placeholder="08123456789" class="w-full px-3 py-2 border rounded-xl text-sm" required>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Alamat Singkat</label>
                <textarea id="klien-alamat" rows="2" class="w-full px-3 py-2 border rounded-xl text-sm"></textarea>
            </div>

            <div class="pt-3 flex justify-end gap-2 border-t mt-4">
                <button type="button" id="btn-cancel-klien" class="px-4 py-2 border rounded-xl text-sm font-medium text-gray-600">Batal</button>
                <button type="submit" class="px-4 py-2 bg-orange-600 hover:bg-orange-700 text-white rounded-xl text-sm font-medium shadow">Simpan Klien</button>
            </div>
        </form>
    </div>
</div>
