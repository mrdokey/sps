<div id="modal-pengeluaran" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
        <div class="flex justify-between items-center mb-4 border-b pb-3">
            <h3 class="text-lg font-bold text-gray-800">Catat Pengeluaran Kantor</h3>
            <button id="btn-close-modal-pengeluaran" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        
        <form id="form-pengeluaran" class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Kategori Pengeluaran *</label>
                <select id="pengeluaran-kategori" class="w-full px-3 py-2 border rounded-xl text-sm" required>
                    <option value="Operasional Kantor">Operasional Kantor (Listrik, Air, Internet)</option>
                    <option value="Bensin / Transportasi">Bensin / Transportasi Field</option>
                    <option value="ATK / Perlengkapan">ATK / Map / Cetak Berkas</option>
                    <option value="Konsumsi">Konsumsi / Makan</option>
                    <option value="Lain-lain">Pengeluaran Lain-lain</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Keterangan Pengeluaran *</label>
                <input type="text" id="pengeluaran-ket" placeholder="Contoh: Beli Map Merah 50 Pcs" class="w-full px-3 py-2 border rounded-xl text-sm" required>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Tanggal *</label>
                <input type="date" id="pengeluaran-tgl" class="w-full px-3 py-2 border rounded-xl text-sm" required>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">Nominal (Rp) *</label>
                <input type="number" id="pengeluaran-nominal" placeholder="50000" class="w-full px-3 py-2 border rounded-xl text-sm" required>
            </div>

            <div class="pt-3 flex justify-end gap-2 border-t mt-4">
                <button type="button" id="btn-cancel-pengeluaran" class="px-4 py-2 border rounded-xl text-sm font-medium text-gray-600">Batal</button>
                <button type="submit" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-sm font-medium shadow">Simpan Pengeluaran</button>
            </div>
        </form>
    </div>
</div>
